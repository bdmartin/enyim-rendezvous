name: Bug Report
description: Report a bug in enyim-rendezvous
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Configure locator with ...
        2. Call Locate("key")
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: hash-algorithm
    attributes:
      label: Hash Algorithm
      description: Which hash algorithm were you using?
      options:
        - FNV-1a (default)
        - MurmurHash3
        - SHA-256
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime, OS, EnyimMemcachedCore version, etc.
      placeholder: |
        - .NET 8.0
        - Ubuntu 22.04
        - EnyimMemcachedCore 2.5.4
    validations:
      required: false
